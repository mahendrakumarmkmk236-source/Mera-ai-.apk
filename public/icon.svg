<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a122c"/>
      <stop offset="50%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Indian Mandala / Neural circular rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3"/>

  <!-- Glowing central neural core / stylized M spark -->
  <g filter="url(#glow)">
    <!-- Central lotus petals / AI nodes -->
    <path d="M 256 120 C 275 180 330 230 380 256 C 330 282 275 332 256 392 C 237 332 182 282 132 256 C 182 230 237 180 256 120 Z" fill="url(#primaryGrad)" opacity="0.95"/>
    <!-- Inner golden star / spark -->
    <path d="M 256 180 C 266 220 296 246 332 256 C 296 266 266 292 256 332 C 246 292 216 266 180 256 C 216 246 246 220 256 180 Z" fill="url(#accentGrad)"/>
    <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  </g>

  <!-- Dynamic Neural Satellite Nodes -->
  <circle cx="160" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="352" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="160" cy="332" r="10" fill="#6366f1"/>
  <circle cx="352" cy="332" r="10" fill="#6366f1"/>
  <line x1="160" y1="180" x2="220" y2="230" stroke="#38bdf8" stroke-width="3" opacity="0.5"/>
  <line x1="352" y1="180" x2="292" y2="230" stroke="#38bdf8" stroke-width="3" opacity="0.5"/>
  <line x1="160" y1="332" x2="220" y2="282" stroke="#6366f1" stroke-width="3" opacity="0.5"/>
  <line x1="352" y1="332" x2="292" y2="282" stroke="#6366f1" stroke-width="3" opacity="0.5"/>

  <!-- "MERA AI" Monogram Accent Text -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">MERA AI</text>
  <text x="256" y="475" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">मेरा AI</text>
</svg>
